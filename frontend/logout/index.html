<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="/bootstrap.bundle.min.js" defer></script>
</head>

<body>
    <main class="login-card">
        <div style="height: 30vh;"></div>
        <div class="border" style="margin: 0% auto; width: 450px; background-color: light-dark (#c8c8c8, #333333); padding: 20px; border-radius: 10px;">
            <h2 style=" text-align: center;">Вы точно желаете выйти?</h2>

            <form action="/api/v1/logout" method="POST">
                <button type="submit" class="btn-submit btn btn-sm btn-outline-secondary align-self-start border"
                    style=" border-radius: 10px; margin: 0% auto; width: 400px; background-color: light-dark (#c8c8c8, #333333); flex: content;">выйти</button>
            </form>
            <div style="padding-top: 1vh;"></div>
            
            <a href="/" class="btn btn-sm btn-outline-secondary align-self-start border"
                style=" border-radius: 10px; margin: 0% auto; width: 400px; background-color: light-dark (#c8c8c8, #333333); flex: content;">назад</a>
        </div>
    </main>
</body>

</html>
