<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка...</title>
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Проверка безопасности...</h2>
    <p>Итерация: <span id="nonce">0</span></p>

    <script>
        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const hash = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function init() {
            const ip = "<!--CLIENT_IP-->";
            const timestamp = Math.floor(Date.now() / 1000);
            const salt = "BigfishForCat";
            const nonceEl = document.getElementById("nonce");

            let nonce = 0;
            
            while (true) {
                const payload = `${ip}:${timestamp}:${nonce}:${salt}`;
                const hash = await sha256(payload);

                if (nonce % 1000 === 0) {
                    nonceEl.textContent = nonce;
                    await new Promise(resolve => setTimeout(resolve, 0));
                }

                if (hash.startsWith("0000")) {
                    document.cookie = `pow_token=${timestamp}:${nonce}:${hash}; path=/; max-age=600; SameSite=Lax`;
                    nonceEl.textContent = "решено:" + hash
                    await new Promise(resolve => setTimeout(resolve, 500));
                    location.reload();
                    break;
                }
                nonce++;
            }
        }
        init();
    </script>
</body>
</html>
