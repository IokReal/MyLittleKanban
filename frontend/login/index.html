<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="/bootstrap.bundle.min.js" defer></script>
</head>

<body>
    <main class="login-card">
        <div style="height: 30vh;"></div>
        <div class="border" style=" margin: 0% auto; width: 500px; background-color: light-dark (#c8c8c8, #333333); padding: 20px; border-radius: 10px;">
            <h2 style="text-align: center;">Авторизация/регистрация</h2>

            <form action="/api/v1/login" method="POST" class="login-form">
                <div class="form-group">
                    <label for="username">Логин <s>или Email</s></label>
                    <input type="text" name="username" id="username" placeholder="Введите логин" required
                        autocomplete="username" style=" text-align: center;">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" name="password" id="password" placeholder="Введите пароль" required
                        autocomplete="current-password" style="text-align: center;">
                </div>
                <!-- 
            <div class="otp" data-bs-otp>
                <input type="text" class="otp-input" maxlength="6" aria-label="Verification code" name="otp" id="otp">
            </div> 
            -->
            <div style="margin: 0% auto; display: flex; padding-top: 15px;">
                <button type="submit" class="btn-submit" style=" border-radius: 10px; margin: 0% auto; width: 400px; background-color: light-dark (#c8c8c8, #333333);">Войти</button>
            </div>
                
            </form>
        </div>
    </main>
</body>

</html>
