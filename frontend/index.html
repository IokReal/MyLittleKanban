<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <script src="skripts.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>

    <link href="/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="/bootstrap.bundle.min.js" defer></script>

    <!-- Шаблон карточки и колонки -->
    <div id="tamplate" class="d-none">
        <div class="tab card bg-light shadow-sm p-3 me-3 flex-shrink-0" style="min-width: 10%; max-width: 20%;"
            data-task_group_id="{task_group_id}" ondrop="taskDropEvent(event, this)"
            ondragover="((ev) => {ev.preventDefault();})(event)">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="card-title text-dark fw-bold mb-0">{tab_name}</h4>
                <button class="btn btn-sm btn-outline-danger" data-tab-id="{task_group_id}"
                    onclick="delete_tab_prompt(this)">×</button>
            </div>

            <!-- Кнопка добавления задачи в конкретную колонку -->
            <button class="btn btn-outline-primary btn-sm mb-3 w-100" data-tab-id="{task_group_id}"
                onclick="openAddTaskDialog(this)">+ Добавить задачу</button>

            <div class="tasks-list d-flex flex-column gap-2">
                <div class="task card border shadow-sm p-2" data-task-id="{task_id}" draggable="true"
                    ondragstart="event.dataTransfer.setData('task-id', this.dataset.taskId)">
                    <h5 class="h6 fw-bold text-primary mb-1">{tasks_name}</h5>
                    <p class="small text-muted mb-2">{text}</p>
                    <div class="d-flex justify-content-between align-items-center mt-auto">
                        <button class="btn btn-sm btn-outline-secondary align-self-start" data-task-id="{task_id}"
                            onclick="muveTask(this)">изменить статус</button>
                        <button class="btn btn-sm btn-outline-secondary align-self-start" data-task_id="{task_id}"
                            onclick="edit_task(this)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <style>
        dialog[open] {
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-body-tertiary min-vh-100 d-flex flex-column" onload="init()">
    <header class="navbar navbar-dark bg-dark shadow-sm px-4 mb-4">
        <div class="container-fluid d-flex align-items-center gap-3">
            <span class="navbar-brand mb-0 h1"><img src="favicon.ico" alt="Icon"
                    class="d-inline-block rounded align-text-top"> My Little Kanban</span>
            <div class="d-flex align-items-center gap-2">
                <label for="project_select" class="text-white-50 small mb-0">Текущий проект:</label>
                <select id="project_select" class="form-select form-select-sm w-auto" onchange="selectProject()">
                    <option value="">Загрузка...</option>
                </select>
                <button class="btn btn-outline-light btn-sm" onclick="openAddProjectDialog()">+ Новый проект</button>
                <button class="btn btn-outline-light btn-sm"
                    onclick="document.getElementById('manegeProject_dialog').showModal();"><svg
                        xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list"
                        viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
                    </svg></button>
            </div>
        </div>
    </header>

    <main class="container-fluid px-4 flex-grow-1 d-flex flex-column">
        <div class="mb-4">
            <button class="btn btn-primary" onclick="openAddTabDialog()">+ Создать колонку</button>
        </div>
        <!-- Контейнер колонок с горизонтальным скроллом, если колонок много -->
        <div id="tabs" class="d-flex flex-row align-items-start overflow-auto pb-4 flex-grow-1"></div>
    </main>

    <!-- Модальное окно перемещения -->
    <dialog id="move_dialog" class="p-4 border-0 rounded shadow-lg" style="max-width: 400px; width: 100%;">
        <h5 class="mb-3">Переместить в колонку</h5>
        <div class="mb-3">
            <select id="move_dialog_select" class="form-select" onchange="confirmMoveTask()">
                <option value="">Выберите колонку...</option>
            </select>
        </div>
        <div class="text-end">
            <button class="btn btn-secondary btn-sm"
                onclick="document.getElementById('move_dialog').close();">Отмена</button>
        </div>
    </dialog>

    <!-- Модальное окно создания задачи -->
    <dialog id="add_task_dialog" class="p-4 border-0 rounded shadow-lg" style="max-width: 450px; width: 100%;">
        <form onsubmit="confirmAddTask(event)">
            <h5 class="mb-3">Новая задача</h5>
            <div class="mb-3">
                <input type="text" id="new_task_name" class="form-control" placeholder="Название задачи" required>
            </div>
            <div class="mb-3">
                <textarea id="new_task_text" class="form-control" placeholder="Описание задачи" rows="3"></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary btn-sm"
                    onclick="document.getElementById('add_task_dialog').close();">Отмена</button>
                <button type="submit" class="btn btn-success btn-sm">Создать</button>
            </div>
        </form>
    </dialog>

    <!-- Модальное окно ошибки -->
    <dialog id="cannot_loadPproject_data_dialog" class="p-4 border-0 rounded shadow-lg"
        style="max-width: 400px; width: 100%;">
        <form method="dialog">
            <h5 class="text-danger mb-2">Ошибка</h5>
            <p class="text-muted mb-3">Не получилось загрузить данные проекта</p>
            <div class="text-end">
                <button class="btn btn-secondary btn-sm"
                    onclick="document.getElementById('cannot_loadPproject_data_dialog').close();">Ок</button>
            </div>
        </form>
    </dialog>

    <!-- Модальное окно создания колонки -->
    <dialog id="addNewTab_dialog" class="p-4 border-0 rounded shadow-lg" style="max-width: 400px; width: 100%;">
        <form onsubmit="confirmAddTab(event)">
            <h5 class="mb-3">Новая колонка</h5>
            <div class="mb-3">
                <input type="text" id="new_tab_name" class="form-control" placeholder="Название колонки" required>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary btn-sm"
                    onclick="document.getElementById('addNewTab_dialog').close();">Отмена</button>
                <button type="submit" class="btn btn-success btn-sm">Создать</button>
            </div>
        </form>
    </dialog>

    <!-- Модальное окно создания колонки -->
    <dialog id="editTask_dialog" class="p-4 border-0 rounded shadow-lg" style="max-width: 400px; width: 100%;">
        <button type="button" class="btn btn-solid btn-sm btn-text"
            onclick="document.getElementById('editTask_dialog').close();">X</button>
        <button class="btn btn-solid theme-danger" onclick="delet_task()">удолить</button>
    </dialog>

    <!-- Модальное окно создания проекта -->
    <dialog id="addNewProject_dialog" class="p-4 border-0 rounded shadow-lg" style="max-width: 450px; width: 100%;">
        <form onsubmit="confirmAddProject(event)">
            <h5 class="mb-3">Новый проект</h5>
            <div class="mb-3">
                <input type="text" id="new_project_name" class="form-control" placeholder="Название проекта" required>
            </div>
            <div class="mb-3">
                <textarea id="new_project_desc" class="form-control" placeholder="Описание проекта" rows="3"></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary btn-sm"
                    onclick="document.getElementById('addNewProject_dialog').close();">Отмена</button>
                <button type="submit" class="btn btn-success btn-sm">Создать</button>
            </div>
        </form>
    </dialog>

    <!-- диолог упровления проектом -->
    <dialog id="manegeProject_dialog" class="p-4 border-0 rounded shadow-lg h-100 m-0" style="position: fixed; top: 0; right: 0; left: auto; max-width: 450px; width: 100%;">
        <div class="d-flex flex-column mb-3 gap-3 h-100">
            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-solid btn-sm btn-text"
                    onclick="document.getElementById('manegeProject_dialog').close();">X</button>
            </div>
            <h2>Переименовать</h2>
            <div>
                <div class="mb-3 d-flex gap-2">
                    <input type="text" id="new_project_name" class="form-control" placeholder="Название проекта"
                        required>
                    <button class="btn btn-solid theme-success">Ok</button>
                </div>
            </div>
            <div>
                <button class="btn btn-solid theme-danger" onclick="delet_Project()">удолить Проэкт</button>
            </div>
            <div>
                <a href="/logout" class="btn btn-solid theme-danger">Выйли из аккаунта</a>
            </div>
        </div>
    </dialog>
</body>

</html>
