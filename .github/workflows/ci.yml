name: CI Checks

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Здесь можно добавить линтеры или тесты, если появятся, например:
      # - name: Run tests
      #   run: uv run pytest

  # Проверка Rust сервиса (rustBotCheck)
  rust-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rustBotCheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --workspace

      - name: Run cargo test
        run: cargo test --workspace

  # Проверка сборки всего стека через Docker Compose
  docker-compose-build:
    runs-on: ubuntu-latest
    needs: [backend-check, rust-check, frontend-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services via Compose
        run: docker compose build

  # Проверка фронтенда и битых файлов/ссылок
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install HTMLProofer
        run: gem install html-proofer

      - name: Check for broken links and files in frontend
        run: |
          htmlproofer ./frontend \
            --disable-external \
            --check-html