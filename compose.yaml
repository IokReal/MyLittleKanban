services:
  backend:
    build: ./backend
    ports:
      - "9254:9254"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    depends_on:
      - rustbotcheck

  rustbotcheck:
    build: ./rustBotCheck
    ports:
      - "9255:9255"
    restart: unless-stopped

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/var/www/html:ro
    depends_on:
      - rustbotcheck
      - backend