services:
  backend:
    build: ./backend
    ports:
      - "9254:9254"
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  rustBotCheck:
    build: ./rustBotCheck
    ports:
      - "9255:9255"
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/var/www/html:ro
    depends_on:
      - backend