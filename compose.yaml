# compose.yaml
services:
  backend:
    build: ./backend
    ports:
      - "9254:9254"
    restart: unless-stopped
    volumes:
      - kanban_data:/app/data
    depends_on:
      - rustbotcheck

  rustbotcheck:
    build: ./rustBotCheck
    ports:
      - "9255:9255"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - rustbotcheck
      - backend
volumes:
  kanban_data: