events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;
        
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        location ~* \.(php|env|git|yaml)$ {
            auth_request off;
            return 301 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
        }

        set_real_ip_from  192.168.50.0/24;
        set_real_ip_from  172.19.0.0/16;
        real_ip_header    X-Real-IP;
        real_ip_recursive on;

        auth_request /internal-bot-check;

        error_page 403 = @challenge;

        location @challenge {
            auth_request off;
            root /var/www/html;

            sub_filter '<!--CLIENT_IP-->' '$remote_addr';
            sub_filter_once on;
            add_header X-Real-IP $remote_addr always;

            try_files /challenge.html =403;
        }

        location = /internal-bot-check {
            internal;
            auth_request off;

            proxy_pass http://backend:9254/api/v1/check-bot;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header Cookie $http_cookie;
        }

        location = /api/v1/health {
            auth_request off;
            proxy_pass http://backend:9254/api/v1/health;
        }

        # Ошибки клиента (4xx)
        error_page 400 /internal/400.html; # Bad Request (плохой/сломанный запрос)
        error_page 401 /internal/401.html; # Unauthorized (требуется авторизация)
        error_page 403 /internal/403.html; # Forbidden (доступ запрещен)
        error_page 404 /internal/404.html; # Not Found (страница не найдена)
        error_page 405 /internal/405.html; # Method Not Allowed (неподдерживаемый HTTP-метод)
        error_page 408 /internal/408.html; # Request Timeout (таймаут запроса клиента)
        error_page 413 /internal/413.html; # Payload Too Large (файл/запрос слишком большой)
        error_page 429 /internal/429.html; # Too Many Requests (превышен лимит запросов / Rate Limit)

        # Ошибки сервера (5xx)
        error_page 500 /internal/500.html; # Internal Server Error (ошибка в самом Nginx)
        error_page 502 /internal/502.html; # Bad Gateway (бэкенд/FastAPI упал или недоступен)
        error_page 503 /internal/503.html; # Service Unavailable (сервер перегружен или на обслуживании)
        error_page 504 /internal/504.html; # Gateway Timeout (бэкенд отвечал слишком долго)

        location ~ ^/internal/.+ {
            internal;
        }

        location /api {
            proxy_pass http://backend:9254;
            #без x_real_ip ибо оно уже за реверс прокси
        }

        location / {
            root /var/www/html;
            try_files $uri $uri/ $uri.html $uri/index.html =404;
        }
    }
}